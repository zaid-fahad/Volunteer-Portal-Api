services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - logs_data:/app/logs
    networks:
      - dokploy-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  logs_data:

networks:
  dokploy-network:
    external: true
